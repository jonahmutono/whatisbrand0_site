<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BRAND0 — Journal</title>
<link rel="icon" type="image/png" sizes="96x96" href="/my-favicon/favicon-96x96.png"/>
<link rel="icon" type="image/x-icon" href="/my-favicon/favicon.ico"/>
<link rel="apple-touch-icon" href="/my-favicon/apple-touch-icon.png"/>
<link rel="manifest" href="/my-favicon/site.webmanifest"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@200;300;400;500&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #f7f1e5;
    --bg-deep: #efe6d3;
    --ink: #2c2924;
    --muted: #6b6155;
    --faint: #8a7c68;
    --border: rgba(44,41,36,.14);
    --border-strong: rgba(44,41,36,.32);
    --gold: #b8945a;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg); color: var(--ink);
    font-family: 'Jost', sans-serif; font-weight: 300;
    height: 100%; -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }

  /* ── the deck: full-screen scroll-snap, one idea per slide -- same
     mechanic as brand0-site's kidlaroi.html, restyled to Brand0's normal
     cream/gold system instead of that page's one-off dark theme ── */
  .slides { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; scroll-behavior: smooth; }
  .slide {
    height: 100vh; scroll-snap-align: start;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: 3rem 2rem; position: relative;
  }
  .slide-inner {
    max-width: 560px; width: 100%; text-align: center;
    opacity: 0; transform: translateY(18px);
    transition: opacity .7s cubic-bezier(.22,1,.36,1), transform .7s cubic-bezier(.22,1,.36,1);
  }
  .slide-inner.visible { opacity: 1; transform: translateY(0); }

  /* back-to-journal — a quiet, persistent way out rather than a full site
     header, so the deck stays the immersive, one-idea-per-screen thing */
  .journal-exit {
    position: fixed; top: 1.4rem; left: 1.4rem; z-index: 10;
    font-family: 'Roboto Mono', monospace; font-size: 10px; letter-spacing: 3px;
    text-transform: uppercase; color: var(--muted);
  }
  .journal-exit:hover { color: var(--ink); }

  .progress {
    position: fixed; right: 1.4rem; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 9px; z-index: 10;
  }
  .dot {
    width: 4px; height: 4px; border-radius: 50%; background: var(--border-strong);
    opacity: .5; border: none; cursor: pointer; padding: 0;
    transition: opacity .3s, transform .3s, background .3s;
  }
  .dot.active { opacity: 1; transform: scale(1.6); background: var(--gold); }

  /* ── slide content types ── */
  .s-eyebrow {
    font-family: 'Jost', sans-serif; font-size: .72rem; letter-spacing: .22em; text-transform: uppercase;
    color: var(--gold); margin-bottom: 18px;
  }
  .s-title {
    font-family: 'Cormorant Garamond', serif; font-weight: 400;
    font-size: clamp(1.7rem, 4.4vw, 2.5rem); line-height: 1.25; color: var(--ink); margin-bottom: 18px;
  }
  .s-body p {
    font-size: 1.05rem; line-height: 1.75; color: var(--ink); margin-bottom: 1.1em; text-align: left;
  }
  .s-body p:last-child { margin-bottom: 0; }
  /* under a big centered reveal moment (e.g. the archetype name), any body
     copy underneath centers too, rather than defaulting to left -- a rule
     for every reveal-kind slide, not a one-off fix */
  .s-body.s-body-centered p { text-align: center; }

  /* intro: opening seal, mirrors kidlaroi.html's wordmark+sigil opener */
  .s-intro-wordmark { font-family: 'Roboto Mono', monospace; font-weight: 500; letter-spacing: 4px; font-size: .85rem; color: var(--muted); margin-bottom: 10px; }
  .s-intro-sigil { display: block; font-size: 13px; color: var(--gold); letter-spacing: .6em; margin-bottom: 2.5rem; }

  /* reveal: the one big dramatic type moment in a given post */
  .s-reveal { font-family: 'Cormorant Garamond', serif; font-weight: 400; font-size: clamp(2.4rem, 7vw, 4rem); line-height: 1.15; color: var(--gold); }

  /* quote: centered italic pull-quote */
  .s-quote { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 400; font-size: clamp(1.4rem, 3.2vw, 1.9rem); line-height: 1.4; color: var(--ink); }

  .s-image { width: 100%; border-radius: 2px; overflow: hidden; margin-bottom: 14px; }
  .s-image img { width: 100%; display: block; }
  .s-caption { font-size: .85rem; color: var(--muted); }

  /* signoff */
  .s-signoff-line { font-size: .95rem; color: var(--muted); margin-bottom: 6px; }
  .s-signoff-name { font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; color: var(--ink); margin-bottom: 14px; }
  .s-signoff-wordmark { font-family: 'Roboto Mono', monospace; font-weight: 500; letter-spacing: 4px; font-size: .78rem; color: var(--faint); }
  .s-signoff-back { display: inline-block; margin-top: 26px; font-size: .82rem; color: var(--muted); border-bottom: 1px solid var(--border-strong); padding-bottom: 2px; }
  .s-signoff-back:hover { color: var(--ink); border-color: var(--ink); }

  .journal-error {
    height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 2rem; gap: 18px;
  }
  .journal-error p { color: var(--muted); font-size: .95rem; max-width: 380px; }
  .journal-error a { color: var(--gold); border-bottom: 1px solid var(--gold); padding-bottom: 2px; font-size: .82rem; letter-spacing: .05em; text-transform: uppercase; }

  @media (max-width: 600px) {
    .slide { padding: 2.5rem 1.4rem; }
    .progress { right: .7rem; }
  }
</style>
</head>
<body>

<a class="journal-exit" href="/journal">&larr; Journal</a>
<nav class="progress" id="progress"></nav>
<div class="slides" id="slides"></div>

<script>
(function () {
  'use strict';
  var SUPABASE_URL = 'https://qumnkvyzqsmgwznohuld.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_YXT4qh0531_pVdFQLIaR1Q__EtiIj4X';

  function escapeHTML(s) {
    var div = document.createElement('div');
    div.textContent = s == null ? '' : s;
    return div.innerHTML;
  }

  function slugFromPath() {
    // Netlify rewrites /journal/<slug> to this file with status 200 --
    // the address bar keeps the real path, so it's read here rather than
    // relying on a query string.
    var parts = window.location.pathname.replace(/\/+$/, '').split('/');
    return decodeURIComponent(parts[parts.length - 1] || '');
  }

  function renderSlide(s) {
    var kind = s.kind || 'text';
    var inner = '';

    if (kind === 'intro') {
      inner =
        (s.eyebrow ? '<div class="s-intro-wordmark">' + escapeHTML(s.eyebrow) + '</div>' : '<div class="s-intro-wordmark">BRAND0</div>') +
        '<span class="s-intro-sigil">&#10022;</span>' +
        (s.title ? '<h1 class="s-title">' + escapeHTML(s.title) + '</h1>' : '') +
        renderBody(s.body);
    } else if (kind === 'reveal') {
      inner =
        (s.eyebrow ? '<div class="s-eyebrow">' + escapeHTML(s.eyebrow) + '</div>' : '') +
        '<div class="s-reveal">' + escapeHTML(s.title || '') + '</div>' +
        renderBody(s.body, /* centered */ true); // every reveal-kind slide centers its body underneath, not just this one
    } else if (kind === 'quote') {
      inner = '<p class="s-quote">' + escapeHTML((s.body && s.body[0]) || s.title || '') + '</p>';
    } else if (kind === 'image') {
      inner =
        (s.image_url ? '<div class="s-image"><img src="' + escapeHTML(s.image_url) + '" alt="' + escapeHTML(s.title || '') + '" loading="lazy"/></div>' : '') +
        (s.title ? '<h2 class="s-title">' + escapeHTML(s.title) + '</h2>' : '') +
        (s.caption ? '<p class="s-caption">' + escapeHTML(s.caption) + '</p>' : '') +
        renderBody(s.body);
    } else if (kind === 'signoff') {
      inner =
        (s.body && s.body[0] ? '<p class="s-signoff-line">' + escapeHTML(s.body[0]) + '</p>' : '') +
        (s.title ? '<p class="s-signoff-name">' + escapeHTML(s.title) + '</p>' : '') +
        '<div class="s-signoff-wordmark">BRAND0</div>' +
        '<a class="s-signoff-back" href="/journal">Back to the Journal</a>';
    } else { // 'text' and anything unrecognized
      inner =
        (s.eyebrow ? '<div class="s-eyebrow">' + escapeHTML(s.eyebrow) + '</div>' : '') +
        (s.title ? '<h2 class="s-title">' + escapeHTML(s.title) + '</h2>' : '') +
        renderBody(s.body);
    }

    return '<section class="slide"><div class="slide-inner">' + inner + '</div></section>';
  }

  function renderBody(body, centered) {
    if (!body || !body.length) return '';
    var cls = centered ? 's-body s-body-centered' : 's-body';
    return '<div class="' + cls + '">' + body.map(function (p) { return '<p>' + escapeHTML(p) + '</p>'; }).join('') + '</div>';
  }

  function showError(message) {
    document.getElementById('progress').style.display = 'none';
    document.querySelector('.journal-exit').style.display = 'none';
    document.getElementById('slides').innerHTML =
      '<div class="journal-error">' +
        '<div class="s-intro-wordmark">BRAND0</div>' +
        '<p>' + escapeHTML(message) + '</p>' +
        '<a href="/journal">Back to the Journal</a>' +
      '</div>';
  }

  var slug = slugFromPath();
  if (!slug) { showError('No post specified.'); return; }

  fetch(
    SUPABASE_URL + '/rest/v1/journal_posts?slug=eq.' + encodeURIComponent(slug) + '&select=title,slides',
    { headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY } }
  )
    .then(function (res) { if (!res.ok) throw new Error('fetch failed: ' + res.status); return res.json(); })
    .then(function (rows) {
      var post = rows && rows[0];
      if (!post) { showError('This post could not be found — it may be unpublished or removed.'); return; }
      if (post.title) document.title = 'BRAND0 — ' + post.title;

      var slides = Array.isArray(post.slides) ? post.slides : [];
      if (!slides.length) { showError('This post has no content yet.'); return; }

      document.getElementById('slides').innerHTML = slides.map(renderSlide).join('');
      setupDeck();
    })
    .catch(function (e) {
      console.error('Journal post failed:', e);
      showError('This post is temporarily unavailable — please try again shortly.');
    });

  function setupDeck() {
    var slideEls = Array.from(document.querySelectorAll('.slide'));
    var progressNav = document.getElementById('progress');

    slideEls.forEach(function (_, i) {
      var dot = document.createElement('button');
      dot.className = 'dot' + (i === 0 ? ' active' : '');
      dot.setAttribute('aria-label', 'Slide ' + (i + 1));
      dot.addEventListener('click', function () { slideEls[i].scrollIntoView({ behavior: 'smooth' }); });
      progressNav.appendChild(dot);
    });
    var dots = document.querySelectorAll('.dot');

    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduceMotion) {
      document.querySelectorAll('.slide-inner').forEach(function (el) { el.classList.add('visible'); });
    }

    if (!('IntersectionObserver' in window)) {
      document.querySelectorAll('.slide-inner').forEach(function (el) { el.classList.add('visible'); });
      return;
    }

    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        var idx = slideEls.indexOf(entry.target);
        if (entry.isIntersecting) {
          if (!reduceMotion) entry.target.querySelector('.slide-inner').classList.add('visible');
          dots.forEach(function (d, i) { d.classList.toggle('active', i === idx); });
        }
      });
    }, { threshold: .5 });
    slideEls.forEach(function (el) { observer.observe(el); });
  }
})();
</script>

</body>
</html>
